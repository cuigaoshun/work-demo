syntax = "proto3";

package work;

option go_package = "example.com/work-demo/service/work/kitex_gen/work";

service WorkService {
  rpc GetWork(GetWorkRequest) returns (GetWorkResponse);
}

message GetWorkRequest {
  int64 work_id = 1;
}

message Work {
  int64 id = 1;
  string name = 2;
  int64 user_id = 3;
}

message GetWorkResponse {
  Work work = 1;
}
