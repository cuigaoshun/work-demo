syntax = "proto3";

package user;

option go_package = "example.com/work-demo/service/user/kitex_gen/user";

service UserService {
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
}

message GetUserRequest {
  int64 user_id = 1;
}

message User {
  int64 id = 1;
  string name = 2;
}

message GetUserResponse {
  User user = 1;
}
