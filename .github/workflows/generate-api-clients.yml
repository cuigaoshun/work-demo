name: generate api clients

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "api/*.proto"
      - "Makefile"
      - ".github/workflows/generate-api-clients.yml"

permissions:
  contents: write

concurrency:
  group: generate-api-clients-main
  cancel-in-progress: false

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: setup protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "3.21.12"

      - name: setup java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: setup dart
        uses: dart-lang/setup-dart@v1

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: install swift plugin
        run: brew install swift-protobuf

      - name: install dart plugin
        run: |
          dart pub global activate protoc_plugin
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: install arkts plugin
        run: npm install -g @larkoh/protoc-gen-ets

      - name: generate api clients
        run: make gen-api-clients

      - name: commit generated code
        run: |
          if git diff --quiet -- api; then
            echo "no generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@github.com"
          git add api
          git commit -m "init"
          git push origin HEAD:main
