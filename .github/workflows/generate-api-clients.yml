name: generate api clients

on:
  push:
    branches:
      - main
    paths:
      - "api/*.proto"
      - "Makefile"
      - ".github/workflows/generate-api-clients.yml"

permissions:
  contents: write

concurrency:
  group: generate-api-clients-main
  cancel-in-progress: true

jobs:
  generate:
    if: github.actor != 'github-actions[bot]' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: setup protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          protoc --version

      - name: setup swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"

      - name: setup java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: setup dart
        uses: dart-lang/setup-dart@v1

      - name: setup node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: install swift plugin
        run: |
          git clone --depth=1 https://github.com/apple/swift-protobuf.git /tmp/swift-protobuf
          cd /tmp/swift-protobuf
          swift build -c release
          sudo cp .build/release/protoc-gen-swift /usr/local/bin/

      - name: install dart plugin
        run: |
          dart pub global activate protoc_plugin
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: install arkts plugin
        run: npm install -g @larkoh/protoc-gen-ets

      - name: generate api clients
        run: make gen-api-clients

      - name: commit generated code
        run: |
          if git diff --quiet -- api; then
            echo "no generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@github.com"
          git add api
          git commit -m "init"
          git pull --rebase origin main
          git push origin HEAD:main
