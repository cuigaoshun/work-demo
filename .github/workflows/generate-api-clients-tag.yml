name: generate api clients

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

concurrency:
  group: generate-api-clients-realese
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      RELEASE_BRANCH: realese-${{ github.ref_name }}
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: setup go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.0"

      - name: install code generators
        run: |
          go install github.com/cloudwego/kitex/tool/cmd/kitex@v0.16.3
          go install github.com/cloudwego/hertz/cmd/hz@v0.9.7
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: setup protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          protoc --version

      - name: setup swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2"

      - name: setup java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: setup dart
        uses: dart-lang/setup-dart@v1

      - name: setup node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: install swift plugin
        run: |
          git clone --depth=1 https://github.com/apple/swift-protobuf.git /tmp/swift-protobuf
          cd /tmp/swift-protobuf
          swift build -c release
          sudo cp .build/release/protoc-gen-swift /usr/local/bin/

      - name: install dart plugin
        run: |
          dart pub global activate protoc_plugin
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: install ts-proto plugin
        run: npm install -g ts-proto

      - name: generate api clients
        run: make gen gen-hz gen-api-clients

      - name: commit generated code
        run: |
          git fetch origin "$RELEASE_BRANCH" || true
          new_branch=false
          if git show-ref --verify --quiet "refs/remotes/origin/$RELEASE_BRANCH"; then
            git worktree add /tmp/realese "origin/$RELEASE_BRANCH"
          else
            git worktree add -b "$RELEASE_BRANCH" /tmp/realese "${{ github.sha }}"
            new_branch=true
          fi

          mkdir -p /tmp/realese/generated
          rsync -a --delete generated/flutter/ /tmp/realese/generated/flutter/
          rsync -a --delete generated/objc/ /tmp/realese/generated/objc/
          rsync -a --delete generated/swift/ /tmp/realese/generated/swift/
          rsync -a --delete generated/java/ /tmp/realese/generated/java/
          rsync -a --delete generated/typescript/ /tmp/realese/generated/typescript/
          rsync -a --delete generated/cpp/ /tmp/realese/generated/cpp/
          rsync -a --delete kitex_gen/ /tmp/realese/kitex_gen/
          rsync -a --delete internal/model/ /tmp/realese/internal/model/
          rsync -a --delete internal/handler/ /tmp/realese/internal/handler/
          rsync -a --delete internal/router/ /tmp/realese/internal/router/
          rsync -a --delete internal/service/user/data/ent/ /tmp/realese/internal/service/user/data/ent/
          rsync -a --delete internal/service/work/data/ent/ /tmp/realese/internal/service/work/data/ent/
          rsync -a cmd/gateway/wire_gen.go /tmp/realese/cmd/gateway/wire_gen.go
          rsync -a cmd/test/wire_gen.go /tmp/realese/cmd/test/wire_gen.go
          rsync -a cmd/user/wire_gen.go /tmp/realese/cmd/user/wire_gen.go
          rsync -a cmd/work/wire_gen.go /tmp/realese/cmd/work/wire_gen.go

          cd /tmp/realese
          git add -f generated kitex_gen internal/model internal/handler internal/router \
            internal/service/user/data/ent internal/service/work/data/ent \
            cmd/gateway/wire_gen.go cmd/test/wire_gen.go cmd/user/wire_gen.go cmd/work/wire_gen.go
          if git diff --cached --quiet; then
            if [ "$new_branch" = true ]; then
              git push origin "HEAD:$RELEASE_BRANCH"
            fi
            echo "no generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@github.com"
          git commit -m "generate API clients for ${{ github.ref_name }}"
          git push origin "HEAD:$RELEASE_BRANCH"
