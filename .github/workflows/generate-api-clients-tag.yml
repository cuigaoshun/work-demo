name: generate api clients

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

concurrency:
  group: generate-api-clients-realese
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: setup protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          protoc --version

      - name: setup swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2"

      - name: setup java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: setup dart
        uses: dart-lang/setup-dart@v1

      - name: setup node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: install swift plugin
        run: |
          git clone --depth=1 https://github.com/apple/swift-protobuf.git /tmp/swift-protobuf
          cd /tmp/swift-protobuf
          swift build -c release
          sudo cp .build/release/protoc-gen-swift /usr/local/bin/

      - name: install dart plugin
        run: |
          dart pub global activate protoc_plugin
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: install ts-proto plugin
        run: npm install -g ts-proto

      - name: generate api clients
        run: make gen-api-clients

      - name: commit generated code
        run: |
          git fetch origin realese || true
          if git show-ref --verify --quiet refs/remotes/origin/realese; then
            git worktree add /tmp/realese origin/realese
          else
            git worktree add -b realese /tmp/realese "${{ github.sha }}"
          fi

          rsync -a --delete api/flutter/ /tmp/realese/api/flutter/
          rsync -a --delete api/objc/ /tmp/realese/api/objc/
          rsync -a --delete api/swift/ /tmp/realese/api/swift/
          rsync -a --delete api/java/ /tmp/realese/api/java/
          rsync -a --delete api/typescript/ /tmp/realese/api/typescript/
          rsync -a --delete api/cpp/ /tmp/realese/api/cpp/

          cd /tmp/realese
          if [ -z "$(git status --porcelain --untracked-files=all -- api)" ]; then
            echo "no generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@github.com"
          git add api
          git commit -m "generate API clients for ${{ github.ref_name }}"
          git push origin HEAD:realese
