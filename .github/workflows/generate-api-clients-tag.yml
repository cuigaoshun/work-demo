name: generate api clients

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "发布版本号，例如 v1.2.0"
        required: true
        type: string
      source_branch:
        description: "生成发布分支的源分支"
        required: true
        default: main
        type: string

permissions:
  contents: write

concurrency:
  group: generate-api-clients-${{ inputs.tag }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag }}
      SOURCE_BRANCH: ${{ inputs.source_branch }}
      RELEASE_BRANCH: release-${{ inputs.tag }}
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_branch }}

      - name: validate release references
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "tag must match vX.Y.Z (received: $TAG)"
            exit 1
          fi

          if ! git ls-remote --exit-code --heads origin "$SOURCE_BRANCH" >/dev/null; then
            echo "source branch does not exist: $SOURCE_BRANCH"
            exit 1
          fi

          if git ls-remote --exit-code --heads origin "$RELEASE_BRANCH" >/dev/null; then
            echo "release branch already exists: $RELEASE_BRANCH"
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "tag already exists: $TAG"
            exit 1
          fi

      - name: setup go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.0"

      - name: install code generators
        run: |
          go install github.com/cloudwego/kitex/tool/cmd/kitex@v0.16.3
          go install github.com/cloudwego/hertz/cmd/hz@v0.9.7
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: setup protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          protoc --version

      - name: setup swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2"

      - name: setup java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: setup dart
        uses: dart-lang/setup-dart@v1

      - name: setup node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: install swift plugin
        run: |
          git clone --depth=1 https://github.com/apple/swift-protobuf.git /tmp/swift-protobuf
          cd /tmp/swift-protobuf
          swift build -c release
          sudo cp .build/release/protoc-gen-swift /usr/local/bin/

      - name: install dart plugin
        run: |
          dart pub global activate protoc_plugin
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: install ts-proto plugin
        run: npm install -g ts-proto

      - name: commit generated code
        run: |
          git switch -c "$RELEASE_BRANCH"
          make gen gen-hz
          make -f api/Makefile gen-api-clients
          ./scripts/stage-generated.sh
          if git diff --cached --quiet; then
            echo "no generated changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@github.com"
            git commit -m "generate API clients for $TAG"
          fi
          git push origin "HEAD:$RELEASE_BRANCH"

      - name: create tag on release branch
        run: |
          git tag "$TAG"
          git push origin "refs/tags/$TAG"
