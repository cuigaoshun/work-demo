syntax = "proto3";

package user;

option go_package = "example.com/work-demo/hertz/biz/model/user";

import "api.proto";

message GetUserNameRequest {
  int64 user_id = 1 [(api.path) = "id"];
}

message GetUserNameResponse {
  string name = 1;
}

service UserService {
  rpc GetUserName(GetUserNameRequest) returns (GetUserNameResponse) {
    option (api.get) = "/users/:id";
  }
}
