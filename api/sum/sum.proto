syntax = "proto3";

package workdemo.api.sum;

option go_package = "example.com/work-demo/internal/gateway/model/sum";

import "api.proto";

message AddRequest {
  int64 left = 1 [(workdemo.api.query) = "left"];
  int64 right = 2 [(workdemo.api.query) = "right"];
}

message AddResponse {
  int64 result = 1;
}

service SumService {
  rpc Add(AddRequest) returns (AddResponse) {
    option (workdemo.api.get) = "/sum";
  }
}
